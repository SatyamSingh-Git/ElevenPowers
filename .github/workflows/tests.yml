name: tests

# The isolated Linux worker Phase A asks for. Every measurement this project has
# published was taken on one Windows laptop, and letting that laptop's lack of
# Docker define the scientific scope was the mistake the audit named. A hosted
# Linux runner is not a container farm, and it is enough to stop a result being
# a property of one machine: several of the defects fixed this week were
# platform-shaped, including a shell tool the runtime never subscribed to and a
# `git apply` that silently did nothing because the home directory was a
# repository.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  suite:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Optional mutation engine acceptance dependencies
        run: |
          python -m pip install -r requirements-strength.txt -r requirements-impact.txt -r requirements-impact-eval.txt
          npm install --prefix .venv/strength-js --ignore-scripts --no-audit --no-fund @stryker-mutator/instrumenter@9.5.1 typescript@5.7.3
      - name: Standard-library runtime without site packages
        run: python -S -c "import core.pytest_scope; import core.commands; import eval.command_invocations; import core.milestones; import eval.milestones; import eval.milestone_rechecks; import core.milestones.rechecks; import core.milestones.automatic; import core.milestones.advice_worker; import core.milestones.delivery; import eval.advice_delivery; import eval.milestone_large; import eval.advice_callbacks; import eval.preservation; import eval.preservation_archive; import eval.preservation_cases; import eval.preservation_oracles; import core.impact; import core.strength.runner; import core.export; import core.hosts.validation; import core.hosts.performance; import eval.paired; import eval.benefit; import eval.benefit_archive; import eval.proposals; import eval.hard_archive; import eval.hard_audit"
      - name: PatchProof standard-library imports
        run: python -S -c "import core.patchproof.identity; import core.patchproof.report; import core.patchproof.planning; import core.patchproof.execution; import core.patchproof.execution_state; import core.patchproof.execution_report; import eval.execution_reliability; import eval.patchproof; import core.patchproof.openapi; import core.patchproof.contract_report; import eval.openapi_contracts; import eval.oasdiff_install; import core.patchproof.github_context; import core.patchproof.github; import core.patchproof.github_output; import eval.github_presentation"
      - name: Pinned optional OpenAPI acceptance checker
        run: |
          python -m eval.oasdiff_install --directory .venv/oasdiff-ci
          python -c "import os, pathlib; p=pathlib.Path('.venv/oasdiff-ci') / ('oasdiff.exe' if os.name == 'nt' else 'oasdiff'); f=open(os.environ['GITHUB_ENV'],'a',encoding='utf-8'); f.write('EP_OASDIFF=' + str(p.resolve()) + '\n'); f.close()"
      - name: External input standard-library imports
        run: python -S -c "import core.inputs.definition; import core.inputs.bindings; import core.inputs.collection; import core.inputs.access; import core.inputs.receipts; import core.inputs.native; import core.inputs.execution; import core.inputs.scopes; import core.inputs.shared; import eval.external_inputs; import eval.input_sessions; import eval.input_scopes; import eval.input_scope_pilot"
      - name: Declared-check standard-library imports
        run: python -S -c "import core.checks; import core.check_batch; import eval.declared_checks; import eval.check_adoption"
      - name: Multi-stage standard-library imports
        run: python -S -c "import eval.declared_workflow; import eval.workflow_cases; import eval.workflow_oracles; import eval.workflow_results; import eval.workflow_rehearsal"
      - name: Identify the environment
        run: python -c "import platform, sys; print(sys.version); print(platform.platform())"
      # git needs an identity before the fixtures that commit will work, and the
      # default branch name has to be pinned or the seeded repositories differ
      # between runners.
      - name: Configure git
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "CI"
          git config --global init.defaultBranch main
      - name: Tests
        run: python -m pytest -q
      - name: Retained execution reliability controls
        run: python -m eval.execution_reliability --repetitions 10 --seconds 240
      - name: Actual owned declared-check acceptance
        shell: bash
        run: python -m eval.declared_checks --output "$RUNNER_TEMP/ep-declared-checks"
      - name: Actual declared batch and guidance acceptance without models
        shell: bash
        run: python -m eval.check_adoption --output "$RUNNER_TEMP/ep-check-adoption"
      - name: Retain batch adoption controls
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: check-adoption-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/ep-check-adoption/result.json
          retention-days: 7
      - name: Retain declared-check observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: declared-checks-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/ep-declared-checks/result.json
          retention-days: 7
      - name: Actual external dependency drift acceptance
        shell: bash
        run: python -m eval.external_inputs --output "$RUNNER_TEMP/ep-external-inputs"
      - name: Four-stage no-model workflow and source reproduction
        shell: bash
        run: python -m eval.workflow_rehearsal --output "$RUNNER_TEMP/ep-installed-multistage"
      - name: Retain multi-stage control observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: installed-multistage-${{ matrix.os }}-${{ matrix.python }}
          path: |
            ${{ runner.temp }}/ep-installed-multistage/result.json
            ${{ runner.temp }}/ep-installed-multistage/protocol.json
            ${{ runner.temp }}/ep-installed-multistage/*/result.json
          retention-days: 7
      - name: Actual ordinary-session external input acceptance
        shell: bash
        run: python -m eval.input_sessions --output "$RUNNER_TEMP/ep-input-sessions"
      - name: Actual scoped-versus-broad command and shared collection acceptance
        shell: bash
        run: python -m eval.input_scopes --output "$RUNNER_TEMP/ep-input-scopes"
      - name: Retain command-scope observations
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: command-input-scopes-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/ep-input-scopes/result.json
          retention-days: 7
      - name: The audit probes, named separately so a failure is legible
        run: python -m pytest tests/test_audit_probes.py -q
      - name: Grade the grader
        run: python -m eval.validate
      - name: Reproduce published staged source grades without a model
        run: python results/behavior-preservation/reproduce.py
      - name: The join between the runtime and its host
        run: python plugin/bin/ep_doctor.py --host

  github-evidence-presentation:
    name: GitHub evidence presentation (disposable acceptance)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare independent actual-command exercise
        id: fixture
        shell: bash
        run: |
          python -m eval.github_presentation --output "$RUNNER_TEMP/ep-github-exercise" \
            --repository "$GITHUB_REPOSITORY" --actions-output "$GITHUB_OUTPUT" --external-inputs
      - name: Publish informational evidence, including the missing check
        id: evidence
        uses: ./github/patchproof
        with:
          project: ${{ steps.fixture.outputs.project }}
          base: ${{ steps.fixture.outputs.base }}
          head: ${{ steps.fixture.outputs.head }}
          retention-days: '7'
