name: execution reliability

on:
  workflow_dispatch:

jobs:
  retained-controls:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Repeat JavaScript advice ingress with retained component diagnostics
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from eval.advice_delivery import exercise
          for i in range(20):
              value = exercise(Path(os.environ['RUNNER_TEMP']) / f'advice-repetition-{i}',
                               hosts=('claude',), languages=('javascript',))
              print(json.dumps({'iteration': i, 'qualified': value['qualified']}), flush=True)
              assert value['qualified'], json.dumps(value, indent=2)
          PY
      - name: Retain advice diagnostics even after failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: advice-reliability-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/advice-repetition-*/summary.json
          retention-days: 7
      - name: Repeat actual interrupt, termination and quoted launcher controls
        run: python -m eval.execution_reliability --repetitions 30 --seconds 600
