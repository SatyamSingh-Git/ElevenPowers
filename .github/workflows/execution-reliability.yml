name: execution reliability

on:
  workflow_dispatch:

jobs:
  retained-controls:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - name: Repeat actual interrupt, termination and quoted launcher controls
        run: python -m eval.execution_reliability --repetitions 30 --seconds 600
