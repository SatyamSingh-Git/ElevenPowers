[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lending"
version = "1.4.0"
description = "Circulation desk tools for a small public library"
requires-python = ">=3.10"

[project.scripts]
lend = "lending.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
