[project]
name = "fleetkeep"
version = "0.4.0"
description = "Maintenance records and reports for a vehicle fleet"
requires-python = ">=3.11"

[project.scripts]
fleetkeep = "fleetkeep.cli.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
