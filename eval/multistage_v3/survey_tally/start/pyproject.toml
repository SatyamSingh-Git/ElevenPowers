[project]
name = "surveytally"
version = "0.9.0"
description = "Import survey responses, weight them and tabulate the results"
requires-python = ">=3.11"

[project.scripts]
surveytally = "surveytally.cli.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
