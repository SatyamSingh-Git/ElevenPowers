[project]
name = "gradebook"
version = "0.9.0"
description = "A course gradebook: courses, rosters, scores, letter grades, reports and transcripts"
requires-python = ">=3.11"

[project.scripts]
gradebook = "gradebook.cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
